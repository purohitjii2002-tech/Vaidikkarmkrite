name: VAIDIKKARMKRITE APK Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name vaidikkarmkrite .
      - name: Remove generated Flutter template test
        run: rm -f test/widget_test.dart
      - name: Keep Gradle outputs inside the Flutter project
        run: |
          if [ -f android/build.gradle.kts ]; then
            sed -i 's|.dir("../../build")|.dir("../build")|' android/build.gradle.kts
          elif [ -f android/build.gradle ]; then
            sed -i "s|.dir('../../build')|.dir('../build')|" android/build.gradle
          fi
      - name: Set Android app display name
        run: sed -i 's/android:label="[^"]*"/android:label="KARMKRITE"/' android/app/src/main/AndroidManifest.xml
      - name: Set Android compile SDK
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle
          fi
          grep -n 'compileSdk' android/app/build.gradle*
          cat >> android/build.gradle <<'GRADLE'
          subprojects {
            afterEvaluate { project ->
              if (project.extensions.findByName("android") != null) {
                project.android { compileSdkVersion 36 }
              }
            }
          }
          GRADLE
      - name: Add internet permission
        run: |
          FILE="android/app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.INTERNET' "$FILE" || sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$FILE"
          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$FILE" || sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>' "$FILE"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$FILE" || sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' "$FILE"
      - name: Install dependencies
        run: flutter pub get
      - name: Run Panchang numerical regression tests
        run: flutter test
      - name: Generate app launcher icon
        run: dart run flutter_launcher_icons
      - name: Assemble release APK with Gradle
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon
      - name: Normalize APK output path
        run: |
          mkdir -p build/app/outputs/flutter-apk
          APK="$(find build android -type f -name 'app-release.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Release APK not found. Available APK files:"
            find build android -type f -name '*.apk' -print || true
            exit 1
          fi
          cp "$APK" build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VAIDIKKARMKRITE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
