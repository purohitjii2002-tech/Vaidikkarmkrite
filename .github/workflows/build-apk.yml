name: VAIDIKKARMKRITE APK Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --project-name vaidikkarmkrite .
      - name: Set Android app display name
        run: sed -i 's/android:label="[^"]*"/android:label="KARMKRITE"/' android/app/src/main/AndroidManifest.xml
      - name: Set Android compile SDK
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          fi
      - name: Add internet permission
        run: |
          FILE="android/app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.INTERNET' "$FILE" || sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$FILE"
          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$FILE" || sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>' "$FILE"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$FILE" || sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' "$FILE"
      - name: Install dependencies
        run: flutter pub get
      - name: Generate app launcher icon
        run: dart run flutter_launcher_icons
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VAIDIKKARMKRITE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
