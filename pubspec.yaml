name: vaidikkarmkrite
description: KARMKRITE - Shastra se Sanskar tak
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  astronomia: ^1.1.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/karmkrite logo.png.jpg
    - assets/data/india_states_districts.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/karmkrite logo.png.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/karmkrite logo.png.jpg"
  min_sdk_android: 21